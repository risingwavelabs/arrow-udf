[package]
name = "arrow-udf-runtime"
version = "0.10.0"
description = "Runtime for Arrow UDFs."
keywords = ["arrow", "udf", "runtime"]
edition.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
# The JavaScript runtime is left out of the docs.rs build: rquickjs 0.6 does not compile on the
# nightly docs.rs uses, which would fail the whole build. Drop this once the JavaScript runtime
# moves off rquickjs 0.6, see https://github.com/arrow-udf/arrow-udf/issues/162.
no-default-features = true
features = ["wasm", "python", "remote"]

[features]
default = ["wasm", "python", "javascript", "remote"]
embedded = ["wasm", "python", "javascript"]

wasm = ["wasm-runtime", "wasm-build"]
python = ["python-runtime"]
javascript = ["javascript-runtime", "javascript-fetch"]
remote = ["remote-runtime"]

wasm-runtime = ["dep:wasi-common", "dep:wasmtime", "dep:genawaiter2"]
wasm-build = ["dep:tempfile"]
python-runtime = ["dep:pyo3"]
javascript-runtime = ["dep:atomic-time", "dep:rquickjs"]
javascript-fetch = ["dep:reqwest", "dep:serde_json"]
remote-runtime = ["dep:arrow-flight", "dep:tonic", "dep:tracing"]

[dependencies]
anyhow = { workspace = true }
arrow-array = { workspace = true }
arrow-buffer = { workspace = true }
arrow-ipc = { workspace = true }
arrow-schema = { workspace = true }
arrow-select = { workspace = true }
async-trait = "0.1"
base64 = "0.22"
itertools = "0.14"
futures-util = "0.3"
tokio = { workspace = true, features = ["time", "test-util", "macros"] }
thiserror = "2"

wasi-common = { version = "36", optional = true }
wasmtime = { version = "36", optional = true }
genawaiter2 = { version = "0.100.1", optional = true }
tempfile = { version = "3", optional = true }

pyo3 = { version = "0.29.2", optional = true, features = ["auto-initialize"] }

atomic-time = { version = "0.1", optional = true }
rquickjs = { version = "0.6", features = [
    "array-buffer",
    "parallel",
    "futures",
    "macro",
    "loader",
], optional = true }
reqwest = { version = "0.12", features = ["json"], optional = true }
serde_json = { version = "1", optional = true }

arrow-flight = { workspace = true, optional = true }
tonic = { version = "0.14", optional = true }
tracing = { version = "0.1", optional = true }

[build-dependencies]
pyo3-build-config = { version = "0.29", features = ["resolve-config"] }

[dev-dependencies]
arrow-cast = { workspace = true, features = ["prettyprint"] }
arrow-select = { workspace = true }
expect-test = "1"
tokio-test = "0.4"
mockito = "1.6.1"

[[test]]
name = "remote"
test = false
